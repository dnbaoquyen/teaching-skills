  weeks: 15                          # 15 buổi theo đề cương
  language_of_instruction: "Tiếng Việt (thuật ngữ chuyên ngành giữ tiếng Anh)"
  prerequisites: ["EVM1103 Nhập môn quản trị sự kiện"]
  institution_constraints:
    - "PHẠM VI (quyết định GV): chỉ quản trị các bên liên quan BÊN NGOÀI. Quan hệ nội bộ (crew, nhân sự, tình nguyện viên) thuộc môn Quản lý đội nhóm trong tổ chức sự kiện; quản lý đám đông/an toàn đám đông thuộc môn Quản trị rủi ro sự kiện."
    - "Mỗi buổi 135 phút: ưu tiên ~1/2 lý thuyết, ~1/2 thực hành (quyết định GV)."
    - "Không có mẫu giáo án bắt buộc; giáo án phải đủ nội dung học thuật và ứng dụng."
    - "Bài nộp qua LMS theo thời hạn quy định."

