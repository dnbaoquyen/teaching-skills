  - { id: LO1, statement: "Vận dụng kiến thức về Quản trị sự kiện vào Quản trị các mối quan hệ với khách hàng (KAM)", bloom_level: apply, assessed_by: [A4], taught_in: [W2, W3, W4, W5, W6, W7, W8, W13] }
