  - { id: LO4, statement: "Phát triển kỹ năng tự nghiên cứu, tư duy phân tích – tổng hợp, hệ thống, phản biện, sáng tạo trong quản lý các mối quan hệ (bên ngoài) của tổ chức sự kiện — GV quyết định bỏ phạm vi 'nội bộ'", bloom_level: analyze, assessed_by: [A3], taught_in: [W1, W3, W12] }
  - { id: LO5, statement: "Thể hiện kỹ năng điều phối, phân tích, xử lý tình huống, tư duy sáng tạo trong các mối quan hệ đối tác và mối quan hệ khác trong sự kiện", bloom_level: analyze, assessed_by: [A3], taught_in: [W1, W7, W9, W10, W11, W12] }
  - { id: LO6, statement: "Thực hiện kỹ năng làm việc phối hợp cùng các mối quan hệ trong quá trình tổ chức sự kiện", bloom_level: apply, assessed_by: [A3], taught_in: [W1, W9, W10, W11] }
  - { id: LO7, statement: "Thực hiện thành thạo ngoại ngữ trong chuyên môn và giao tiếp", bloom_level: apply, assessed_by: [A3], taught_in: [W1, W14, W15] }
  - { id: LO8, statement: "Hình thành đạo đức và kỷ luật nghề nghiệp, trách nhiệm công dân, xã hội và trách nhiệm đối với đơn vị trong quản trị mối quan hệ tổ chức sự kiện", bloom_level: evaluate, assessed_by: [A4], taught_in: [] }   # GV sẽ tự cân đối buổi đáp ứng
  - { id: LO9, statement: "Thể hiện năng lực lập kế hoạch, điều phối, phát huy trí tuệ tập thể, dẫn dắt chuyên môn trong quản trị mối quan hệ tổ chức sự kiện", bloom_level: create, assessed_by: [A4], taught_in: [] }       # GV sẽ tự cân đối buổi đáp ứng

